name: Shuangxu idle PNG technical preflight
on:
  push:
    branches: [web/idle-r01]
    paths:
      - 'submissions/idle/r01/**'
      - '.github/workflows/shuangxu-idle-audit.yml'
  pull_request:
    paths:
      - 'submissions/idle/r01/**'
      - '.github/workflows/shuangxu-idle-audit.yml'
permissions:
  contents: read
jobs:
  verify-pixels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PNG decoder
        run: python -m pip install 'Pillow==11.3.0'
      - name: Inspect all 20 candidates and masters
        shell: bash
        run: |
          set +e
          python submissions/idle/r01/qa/check_pngs.py --root submissions/idle/r01 --output qa/pixel-audit.json > /tmp/idle_pixel_audit.json
          code=$?
          cat /tmp/idle_pixel_audit.json
          exit "$code"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idle-r01-pixel-audit
          path: submissions/idle/r01/qa/pixel-audit.json
          if-no-files-found: warn
