name: Shuangxu idle r01 targeted image forensics
on:
  push:
    branches: [web/idle-r01]
    paths:
      - 'scripts/idle_r01_forensics.py'
      - '.github/workflows/idle-r01-forensics.yml'
permissions:
  contents: write
jobs:
  analyze-original-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout production branch without touching main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image analysis dependencies
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0' 'numpy==2.2.6'
      - name: Analyze real PNG frames, create composites and numeric evidence
        run: python scripts/idle_r01_forensics.py --repo-root .
      - name: Save QA diagnostic artifacts on existing production branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submissions/idle/r01/qa/diagnostic/
          if git diff --cached --quiet; then
            echo "No new diagnostic files to commit"
          else
            git commit -m "qa(idle): archive actual per-frame composites and quantitative diagnostics"
            git push origin HEAD:refs/heads/web/idle-r01
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idle-r01-targeted-forensics
          path: submissions/idle/r01/qa/diagnostic/
          if-no-files-found: warn
